name: Release

on:
  push:
    tags: ['v*', 'beta*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Create release zip
        run: Compress-Archive -Path "NINA.Plugin.TimelapseRTSP/bin/Release/net8.0-windows/*" -DestinationPath "TimelapseRTSP-${{ github.ref_name }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TimelapseRTSP-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'beta') }}
